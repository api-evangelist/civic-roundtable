name: Civic Roundtable
description: Civic Roundtable is a government operations platform that gives public sector organizations
  one place for the people, partners, and knowledge behind every mission. It combines Workspaces for cross-agency
  collaboration, a Knowledge Base for centralized search across systems, Communications for multi-channel
  stakeholder outreach, a CRM for contact and engagement tracking, Insights for data-driven decision analytics,
  and government-focused AI & Automation. The platform integrates with tools such as Microsoft Teams,
  SharePoint, Google Workspace, Slack, Salesforce, and HubSpot, runs on AWS GovCloud, and serves more
  than 4,000 organizations across all 50 U.S. states. It maintains SOC 2 Type II, FedRAMP High ATO, FIPS
  140-2, and NIST 800-171 security posture. Civic Roundtable is backed by General Catalyst.
